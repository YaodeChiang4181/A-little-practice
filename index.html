<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>經濟系營隊活動報名</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#fff8df);color:#1f2937;font-size:18px}header{background:linear-gradient(135deg,#1267e5,#2749bd);color:white;text-align:center;padding:34px 18px}header h1{margin:0 0 8px;font-size:34px}main{width:min(780px,92%);margin:28px auto}.info{background:#fff4b8;border-left:7px solid #ffb300;padding:18px;border-radius:14px;line-height:1.8;margin-bottom:20px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 30px #0000001a;margin-bottom:20px}h2{color:#1267e5;margin-top:0}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px 14px;border:2px solid #cbd8e8;border-radius:10px;font:inherit}.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g input{display:none}.g label{margin:0;text-align:center;padding:15px;background:#eef5ff;border:2px solid #cadbf5;border-radius:11px;cursor:pointer}.g input:checked+label{background:#1267e5;color:#fff;border-color:#1267e5}.consent{display:flex;gap:10px;padding:15px;background:#f2f7ff;border-radius:11px;font-weight:400}.consent input{width:22px;height:22px;flex:none}button{border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}.primary{width:100%;margin-top:18px;background:#1267e5;color:white}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.edit{background:#ffb020}.danger{background:#df4343;color:white}.secondary{background:#e9f0f7}#ticket{display:none}.ticket{border:3px solid #1267e5;border-radius:16px;overflow:hidden}.ticketHead{background:#1267e5;color:#fff;text-align:center;padding:20px}.ticketBody{padding:22px}.ok{background:#dcf6e7;color:#087443;padding:12px;text-align:center;border-radius:9px;font-weight:700}.row{padding:11px 0;border-bottom:1px solid #e0e7ef}.row b{display:inline-block;width:140px}#msg{display:none;padding:12px;border-radius:9px;margin:10px 0}#msg.err{display:block;background:#ffe2e2;color:#9d1c1c}#msg.ok{display:block;background:#dcf6e7;color:#087443}.hint{font-size:14px;color:#64748b;margin-top:10px}@media(max-width:600px){.groups{grid-template-columns:1fr}.card{padding:20px}}@media print{body *{visibility:hidden}#ticket,#ticket *{visibility:visible}#ticket{display:block!important;position:absolute;inset:0}.buttons{display:none}}
</style></head><body><header><h1>📊 經濟系營隊活動</h1><div>活動報名系統</div></header><main><section class="info"><b>📅 活動日期：</b>10 月 7 日<br><b>🕖 活動時間：</b>晚上 7:00－9:00<br><b>🎓 活動名稱：</b>經濟系營隊活動</section><section id="formCard" class="card"><h2>✏️ 活動報名</h2><div id="msg"></div><form id="form"><label>學號 *</label><input id="studentId" required placeholder="請輸入學號"><label>學生姓名 *</label><input id="studentName" required placeholder="請輸入姓名"><label>電子信箱 (E-mail) *</label><input id="email" type="email" required placeholder="student@university.edu.tw"><label>志願分組選擇 *</label><div class="groups"><div class="g"><input id="A" type="radio" name="group" value="A" required><label for="A">A 組</label></div><div class="g"><input id="B" type="radio" name="group" value="B"><label for="B">B 組</label></div><div class="g"><input id="C" type="radio" name="group" value="C"><label for="C">C 組</label></div></div><label class="consent"><input id="consent" type="checkbox" required><span>我已確認可準時出席，並同意接收相關教材資料</span></label><button id="submitBtn" class="primary" type="submit">✓ 確認報名</button><div class="hint">Google 試算表欄位：Timestamp、學號、學生姓名、E-mail、志願分組選擇、出席與通知確認同意</div></form></section><section id="ticket" class="card"><div class="ticket"><div class="ticketHead"><h2 style="color:white;margin:0">🎫 活動入場證明</h2>經濟系營隊活動</div><div class="ticketBody"><div class="ok">✓ 已完成報名</div><div class="row"><b>學號</b><span id="tId"></span></div><div class="row"><b>姓名</b><span id="tName"></span></div><div class="row"><b>電子信箱</b><span id="tEmail"></span></div><div class="row"><b>志願分組</b><span id="tGroup"></span></div><div class="row"><b>活動日期</b>10 月 7 日</div><div class="row"><b>活動時間</b>晚上 7:00－9:00</div></div></div><div class="buttons"><button class="edit" onclick="editReg()">✏️ 修改報名</button><button class="danger" onclick="removeReg()">🗑 取消報名</button><button class="secondary" onclick="window.print()">🖨 儲存入場證明</button></div></section></main><script>
const API_URL='https://script.google.com/macros/s/AKfycbx5KUbMSaUZw4njBu8scpTuiOOJorZsmHd5QIHsWsgcnc927kbZgY1Kfeo3lUyQkmsUlA/exec';let editing=false,currentId='';const $=id=>document.getElementById(id);
function message(text,type){$('msg').textContent=text;$('msg').className=type;}
function payload(action){const g=document.querySelector('input[name="group"]:checked');return{action,studentId:$('studentId').value.trim(),studentName:$('studentName').value.trim(),email:$('email').value.trim(),group:g?g.value:'',consent:$('consent').checked}}
async function post(data){const r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});return r.json();}
$('form').addEventListener('submit',async e=>{e.preventDefault();const data=payload(editing?'update':'create');if(!data.group||!data.consent)return message('請完成分組與出席確認。','err');$('submitBtn').disabled=true;$('submitBtn').textContent='資料送出中…';try{const result=await post(data);if(!result.success)throw Error(result.message||'操作失敗');currentId=data.studentId;showTicket(data);}catch(err){message(err.message||'連線失敗，請確認 Apps Script 已部署為可存取的 Web App。','err');}finally{$('submitBtn').disabled=false;$('submitBtn').textContent=editing?'💾 儲存修改':'✓ 確認報名';}});
function showTicket(d){$('tId').textContent=d.studentId;$('tName').textContent=d.studentName;$('tEmail').textContent=d.email;$('tGroup').textContent=d.group+' 組';$('formCard').style.display='none';$('ticket').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}
function editReg(){editing=true;$('studentId').readOnly=true;$('ticket').style.display='none';$('formCard').style.display='block';$('submitBtn').textContent='💾 儲存修改';message('正在修改報名資料，學號不可變更。','ok');}
async function removeReg(){if(!confirm('確定要取消報名嗎？此操作會刪除 Google 試算表中的該筆資料。'))return;try{const result=await post({action:'delete',studentId:currentId});if(!result.success)throw Error(result.message||'刪除失敗');alert('報名已取消');$('form').reset();editing=false;currentId='';$('studentId').readOnly=false;$('ticket').style.display='none';$('formCard').style.display='block';$('submitBtn').textContent='✓ 確認報名';$('msg').className='';$('msg').style.display='none';}catch(err){alert(err.message||'取消報名失敗');}}
</script></body></html>
